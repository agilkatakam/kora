name: Feature request
description: An idea that would make Kora better for you.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job or the moment where Kora gets in your way. This matters more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: workaround
    attributes:
      label: What do you do today instead?
